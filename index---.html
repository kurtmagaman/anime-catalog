<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Аниме-каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#111827);--text:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#9ca3af);--secondary:var(--tg-theme-secondary-bg-color,#1f2937)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:max(20px,env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;padding:14px 14px 12px;background:var(--bg)}
h1{margin:0 0 10px;font-size:22px}
#search{width:100%;border:0;outline:0;border-radius:12px;padding:12px 14px;font-size:16px;background:var(--secondary);color:var(--text)}
#search::placeholder{color:var(--hint)}
#catalog{display:flex;flex-direction:column;gap:12px;padding:2px 14px 20px}
.card{display:block;width:100%;padding:0;margin:0;border:0;border-radius:0;overflow:visible;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:0}
.card img{display:block;width:100%;height:auto;margin:0;padding:0;border:0}
.card:active{transform:scale(.995)}
.message{padding:28px 14px;text-align:center;color:var(--hint)}
@media(min-width:760px){.top,#catalog{max-width:760px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
<header class="top">
  <h1>Аниме-каталог</h1>
  <input id="search" type="search" placeholder="Поиск по названию…" autocomplete="off">
</header>
<main id="catalog"><div class="message">Загрузка каталога…</div></main>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

const catalogEl=document.getElementById("catalog");
const search=document.getElementById("search");
let anime=[];

function openAnime(url){
  if(tg?.openTelegramLink) tg.openTelegramLink(url);
  else window.location.href=url;
}

function searchableText(item){
  return [item.title,...(item.aliases||[])].join(" ").toLocaleLowerCase("ru");
}

function render(query=""){
  const q=query.trim().toLocaleLowerCase("ru");
  const items=anime.filter(item=>searchableText(item).includes(q));
  catalogEl.innerHTML="";

  if(!items.length){
    catalogEl.innerHTML='<div class="message">Ничего не найдено</div>';
    return;
  }

  for(const item of items){
    const card=document.createElement("div");
    card.className="card";
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    card.setAttribute("aria-label",item.title);

    const img=document.createElement("img");
    img.src=item.image;
    img.alt=item.title;
    img.loading="lazy";
    img.decoding="async";

    card.appendChild(img);
    card.addEventListener("click",()=>openAnime(item.url));
    card.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        openAnime(item.url);
      }
    });
    catalogEl.appendChild(card);
  }
}

async function loadCatalog(){
  try{
    const response=await fetch("catalog.json?v=1",{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    anime=await response.json();
    render(search.value);
  }catch(error){
    console.error(error);
    catalogEl.innerHTML='<div class="message">Не удалось загрузить каталог</div>';
  }
}

search.addEventListener("input",e=>render(e.target.value));
loadCatalog();
</script>
</body>
</html>
