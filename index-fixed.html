<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Аниме-каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:var(--tg-theme-bg-color,#111827);
  --text:var(--tg-theme-text-color,#fff);
  --hint:var(--tg-theme-hint-color,#9ca3af);
  --secondary:var(--tg-theme-secondary-bg-color,#1f2937);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{padding-bottom:max(20px,env(safe-area-inset-bottom))}
.top{
  position:sticky;
  top:0;
  z-index:10;
  padding:14px 14px 12px;
  background:var(--bg);
}
h1{margin:0 0 10px;font-size:22px}
#search{
  width:100%;
  border:0;
  outline:0;
  border-radius:12px;
  padding:12px 14px;
  font-size:16px;
  background:var(--secondary);
  color:var(--text);
}
#search::placeholder{color:var(--hint)}
#catalog{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:2px 14px 20px;
}
.card{
  position:relative;
  display:block;
  width:100%;
  padding:0;
  margin:0;
  border:0;
  border-radius:0;
  overflow:visible;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  line-height:0;
}
.card:active{transform:scale(.995)}
.card img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
  border:0;
}

/* Плашки — единственное функциональное расширение */
.badges{
  position:absolute;
  top:8px;
  right:8px;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  pointer-events:none;
  line-height:1;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 9px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:999px;
  color:#fff;
  font-size:11px;
  font-weight:800;
  line-height:1;
  white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.45);
  box-shadow:0 2px 7px rgba(0,0,0,.35);
}
.badge-ongoing{background:rgba(0,145,105,.94)}
.badge-new{background:rgba(114,76,210,.95)}
.badge-waiting{background:rgba(205,120,17,.95)}

.badge-heart{
  width:38px;
  height:34px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:27px;
  line-height:1;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));
}
.badge-heart::before{
  content:"♥";
  color:#ee3d75;
  -webkit-text-stroke:1px rgba(255,255,255,.9);
}

.message{padding:28px 14px;text-align:center;color:var(--hint)}

@media(min-width:760px){
  .top,#catalog{max-width:760px;margin-left:auto;margin-right:auto}
}
</style>
</head>
<body>
<header class="top">
  <h1>Аниме-каталог</h1>
  <input id="search" type="search" placeholder="Поиск по названию…" autocomplete="off">
</header>

<main id="catalog"><div class="message">Загрузка каталога…</div></main>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

const catalogEl=document.getElementById("catalog");
const search=document.getElementById("search");
let anime=[];

function openAnime(url){
  if(tg?.openTelegramLink) tg.openTelegramLink(url);
  else window.location.href=url;
}

function searchableText(item){
  return [item.title,...(item.aliases||[])].join(" ").toLocaleLowerCase("ru");
}

function addBadges(card,item){
  const values=Array.isArray(item.badges)?item.badges:[];
  if(!values.length)return;

  const badges=document.createElement("div");
  badges.className="badges";

  for(const raw of values){
    const badge=String(raw).toLowerCase();

    if(badge==="recommendation" || badge==="recommended"){
      const el=document.createElement("div");
      el.className="badge-heart";
      el.title="Рекомендация";
      badges.appendChild(el);
    }

    if(badge==="ongoing"){
      const el=document.createElement("div");
      el.className="badge badge-ongoing";
      el.textContent="● ОНГОИНГ";
      badges.appendChild(el);
    }

    if(badge==="new-episodes" || badge==="new-season"){
      const el=document.createElement("div");
      el.className="badge badge-new";
      el.textContent="✦ НОВЫЕ СЕРИИ";
      badges.appendChild(el);
    }

    if(badge==="waiting" || badge==="continuation"){
      const el=document.createElement("div");
      el.className="badge badge-waiting";
      el.textContent="◷ ЖДЁМ ПРОДОЛЖЕНИЕ";
      badges.appendChild(el);
    }
  }

  if(badges.children.length)card.appendChild(badges);
}

function render(query=""){
  const q=query.trim().toLocaleLowerCase("ru");
  const items=anime.filter(item=>searchableText(item).includes(q));
  catalogEl.innerHTML="";

  if(!items.length){
    catalogEl.innerHTML='<div class="message">Ничего не найдено</div>';
    return;
  }

  for(const item of items){
    const card=document.createElement("div");
    card.className="card";
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    card.setAttribute("aria-label",item.title);

    const img=document.createElement("img");
    img.src=item.image;
    img.alt=item.title;
    img.loading="lazy";
    img.decoding="async";

    card.appendChild(img);
    addBadges(card,item);

    card.addEventListener("click",()=>openAnime(item.url));
    card.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        openAnime(item.url);
      }
    });

    catalogEl.appendChild(card);
  }
}

async function loadCatalog(){
  try{
    const response=await fetch("catalog.json?ts="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    anime=await response.json();
    render(search.value);
  }catch(error){
    console.error(error);
    catalogEl.innerHTML='<div class="message">Не удалось загрузить каталог</div>';
  }
}

search.addEventListener("input",e=>render(e.target.value));
loadCatalog();
</script>
</body>
</html>
