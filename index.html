<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Аниме-каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#111);--text:var(--tg-theme-text-color,#fff);
--hint:var(--tg-theme-hint-color,#999);--secondary:var(--tg-theme-secondary-bg-color,#1b1b1b)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px 12px calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:4px 0 12px}
h1{font-size:22px;margin:5px 2px 11px}.search{width:100%;border:0;outline:0;border-radius:13px;padding:13px 15px;font-size:16px;background:var(--secondary);color:var(--text)}
.grid{display:grid;gap:12px}.card{display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;border-radius:17px;overflow:hidden}
.card img{display:block;width:100%;height:auto;aspect-ratio:1.91/1;object-fit:cover}.card:active{transform:scale(.992)}
.empty{text-align:center;color:var(--hint);padding:35px 10px;display:none}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Аниме-каталог</h1><input id="q" class="search" type="search" placeholder="Поиск по названию…" autocomplete="off"></header>
<main id="grid" class="grid"></main><div id="empty" class="empty">Ничего не найдено</div>
</div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();

const anime=[
 {title:"Табакошка",img:"assets/tabakoshka.png",topic:1069},
 {title:"История о перекуре за супермаркетом",img:"assets/smoking.png",topic:936},
 {title:"Re:Zero. Жизнь с нуля в альтернативном мире",img:"assets/rezero.png",topic:635},
 {title:"Слишком много проигравших героинь",img:"assets/makeine.png",topic:1205},
 {title:"Хочу любить тебя до самой смерти",img:"assets/kimi-shinu.png",topic:1057}
];

const chatId="3557666063";
const grid=document.querySelector("#grid"), empty=document.querySelector("#empty"), q=document.querySelector("#q");

function topicUrl(id){ return `https://t.me/c/${chatId}/${id}`; }
function openTopic(id){
  const url=topicUrl(id);
  if(tg?.openTelegramLink) tg.openTelegramLink(url); else location.href=url;
}
function render(filter=""){
 const s=filter.trim().toLocaleLowerCase("ru");
 const rows=anime.filter(a=>a.title.toLocaleLowerCase("ru").includes(s));
 grid.innerHTML="";
 rows.forEach(a=>{
   const b=document.createElement("button"); b.className="card"; b.type="button";
   b.setAttribute("aria-label",a.title);
   const im=document.createElement("img"); im.src=a.img; im.alt=a.title; im.loading="lazy";
   b.appendChild(im); b.onclick=()=>openTopic(a.topic); grid.appendChild(b);
 });
 empty.style.display=rows.length?"none":"block";
}
q.addEventListener("input",e=>render(e.target.value)); render();
</script>
</body></html>
