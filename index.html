<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Аниме-каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#111827);--text:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#9ca3af);--secondary:var(--tg-theme-secondary-bg-color,#1f2937)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:max(20px,env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;padding:14px 14px 12px;background:var(--bg)}
h1{margin:0 0 10px;font-size:22px}
#search{width:100%;border:0;outline:0;border-radius:12px;padding:12px 14px;font-size:16px;background:var(--secondary);color:var(--text)}
#search::placeholder{color:var(--hint)}
#catalog{display:flex;flex-direction:column;gap:12px;padding:2px 14px 20px}
.card{display:block;width:100%;padding:0;margin:0;border:1px solid rgba(255,255,255,.82);border-radius:15px;overflow:hidden;background:#000;cursor:pointer;-webkit-tap-highlight-color:transparent;appearance:none}
.card:active{transform:scale(.995)}
.card img{display:block;width:100%;height:auto;object-fit:contain;object-position:center}
.empty{display:none;padding:28px 14px;text-align:center;color:var(--hint)}
@media(min-width:760px){.top,#catalog{max-width:760px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
<header class="top"><h1>Аниме-каталог</h1><input id="search" type="search" placeholder="Поиск по названию…" autocomplete="off"></header>
<main id="catalog"></main><div id="empty" class="empty">Ничего не найдено</div>
<script>
const anime=[
{title:"Табакошка",img:"assets/tabakoshka.png",url:"https://t.me/c/3557666063/1069/1070"},
{title:"История о перекуре за супермаркетом",img:"assets/smoking.png",url:"https://t.me/c/3557666063/936/1060"},
{title:"Re:Zero. Жизнь с нуля в альтернативном мире",img:"assets/rezero.png",url:"https://t.me/c/3557666063/635/636"},
{title:"Слишком много проигравших героинь",img:"assets/makeine.png",url:"https://t.me/c/3557666063/1205/1206"},
{title:"Хочу любить тебя до самой смерти",img:"assets/kimi-shinu.png",url:"https://t.me/c/3557666063/1057/1058"}
];
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const catalog=document.getElementById("catalog"),search=document.getElementById("search"),empty=document.getElementById("empty");
function openAnime(url){if(tg?.openTelegramLink)tg.openTelegramLink(url);else window.location.href=url}
function render(query=""){const q=query.trim().toLocaleLowerCase("ru");const items=anime.filter(a=>a.title.toLocaleLowerCase("ru").includes(q));catalog.innerHTML="";empty.style.display=items.length?"none":"block";for(const item of items){const b=document.createElement("button");b.className="card";b.type="button";b.setAttribute("aria-label",item.title);const img=document.createElement("img");img.src=item.img;img.alt=item.title;img.loading="eager";b.appendChild(img);b.addEventListener("click",()=>openAnime(item.url));catalog.appendChild(b)}}
search.addEventListener("input",e=>render(e.target.value));render();
</script>
</body></html>
