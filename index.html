<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Аниме-каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:var(--tg-theme-bg-color,#111827);
  --text:var(--tg-theme-text-color,#fff);
  --hint:var(--tg-theme-hint-color,#9ca3af);
  --secondary:var(--tg-theme-secondary-bg-color,#1f2937);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{padding-bottom:max(20px,env(safe-area-inset-bottom))}
.top{
  position:sticky;
  top:0;
  z-index:10;
  padding:14px 14px 12px;
  background:var(--bg);
}
h1{margin:0 0 10px;font-size:22px}
#search{
  width:100%;
  border:0;
  outline:0;
  border-radius:12px;
  padding:12px 14px;
  font-size:16px;
  background:var(--secondary);
  color:var(--text);
}
#search::placeholder{color:var(--hint)}
#catalog{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:2px 14px 20px;
}
.card{
  position:relative;
  display:block;
  width:100%;
  padding:0;
  margin:0;
  border:0;
  border-radius:0;
  overflow:hidden;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  line-height:0;
  transition:transform .12s ease;
}
.card:active{transform:scale(.995)}
.card img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
  border:0;
}

/* ---------- ПЛАШКИ ---------- */
.badges{
  position:absolute;
  top:clamp(6px,1.3vw,10px);
  right:clamp(6px,1.3vw,10px);
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:clamp(4px,.8vw,7px);
  pointer-events:none;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:5px 9px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:999px;
  color:#fff;
  font-size:clamp(10px,1.6vw,13px);
  font-weight:800;
  line-height:1;
  letter-spacing:.035em;
  white-space:nowrap;
  text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}
.badge .dot{
  width:7px;
  height:7px;
  flex:0 0 7px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.16);
}
.badge-ongoing{
  background:linear-gradient(135deg,rgba(0,170,126,.96),rgba(0,116,94,.96));
}
.badge-new{
  background:linear-gradient(135deg,rgba(91,82,255,.97),rgba(180,61,234,.97));
}
.badge-waiting{
  background:linear-gradient(135deg,rgba(226,143,16,.97),rgba(185,91,18,.97));
}
.badge-icon{font-size:1.05em;line-height:1}

/* Рекомендация: именно плашка-сердце, без текстовой капсулы */
.badge-heart{
  position:relative;
  width:clamp(34px,5.3vw,44px);
  height:clamp(31px,4.9vw,41px);
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.38));
}
.heart-shape{
  position:absolute;
  left:50%;
  top:52%;
  width:68%;
  aspect-ratio:1;
  background:linear-gradient(135deg,#ff4f91,#d81761);
  transform:translate(-50%,-50%) rotate(-45deg);
  border-radius:20% 0 20% 20%;
  border-left:1px solid rgba(255,255,255,.95);
  border-bottom:1px solid rgba(255,255,255,.95);
}
.heart-shape::before,
.heart-shape::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:inherit;
  border-radius:50%;
}
.heart-shape::before{top:-50%;left:0;border-top:1px solid rgba(255,255,255,.95);border-left:1px solid rgba(255,255,255,.95)}
.heart-shape::after{top:0;left:50%;border-top:1px solid rgba(255,255,255,.95);border-right:1px solid rgba(255,255,255,.95)}
.heart-star{
  position:absolute;
  inset:0;
  z-index:2;
  display:grid;
  place-items:center;
  padding-top:1px;
  color:#fff;
  font-size:clamp(15px,2.5vw,21px);
  line-height:1;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}

.message{padding:28px 14px;text-align:center;color:var(--hint)}

@media(min-width:760px){
  .top,#catalog{max-width:760px;margin-left:auto;margin-right:auto}
}
@media(prefers-reduced-motion:no-preference){
  .badge-ongoing .dot{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.55;transform:scale(.82)}
  }
}
</style>
</head>
<body>
<header class="top">
  <h1>Аниме-каталог</h1>
  <input id="search" type="search" placeholder="Поиск по названию…" autocomplete="off">
</header>
<main id="catalog"><div class="message">Загрузка каталога…</div></main>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

const catalogEl=document.getElementById("catalog");
const search=document.getElementById("search");
let anime=[];

/*
  Плашки задаются в catalog.json так:
  "badges": ["ongoing", "recommendation", "new-episodes", "waiting"]

  Допустимые значения:
  ongoing        -> ОНГОИНГ
  recommendation -> сердце-рекомендация
  recommended    -> то же самое, алиас
  new-episodes   -> НОВЫЕ СЕРИИ
  new-season     -> то же самое, алиас
  waiting        -> ЖДЁМ ПРОДОЛЖЕНИЕ
  continuation   -> то же самое, алиас
*/
const BADGE_DEFS={
  ongoing:{type:"pill",className:"badge-ongoing",label:"ОНГОИНГ",icon:"dot",order:20},
  recommendation:{type:"heart",label:"Рекомендация",order:10},
  recommended:{alias:"recommendation"},
  "new-episodes":{type:"pill",className:"badge-new",label:"НОВЫЕ СЕРИИ",icon:"✦",order:30},
  "new-season":{alias:"new-episodes"},
  waiting:{type:"pill",className:"badge-waiting",label:"ЖДЁМ ПРОДОЛЖЕНИЕ",icon:"⏳",order:40},
  continuation:{alias:"waiting"}
};

function openAnime(url){
  if(tg?.openTelegramLink) tg.openTelegramLink(url);
  else window.location.href=url;
}

function searchableText(item){
  return [item.title,...(item.aliases||[])].join(" ").toLocaleLowerCase("ru");
}

function normalizeBadges(rawBadges){
  const result=[];
  const seen=new Set();
  for(const raw of (Array.isArray(rawBadges)?rawBadges:[])){
    let key=String(raw).trim().toLowerCase();
    let def=BADGE_DEFS[key];
    if(!def) continue;
    if(def.alias){key=def.alias;def=BADGE_DEFS[key]}
    if(seen.has(key)) continue;
    seen.add(key);
    result.push({key,...def});
  }
  return result.sort((a,b)=>a.order-b.order);
}

function makeBadgeLayer(item){
  const defs=normalizeBadges(item.badges);
  if(!defs.length) return null;

  const layer=document.createElement("div");
  layer.className="badges";

  for(const def of defs){
    if(def.type==="heart"){
      const heart=document.createElement("div");
      heart.className="badge-heart";
      heart.setAttribute("aria-label",def.label);
      heart.title=def.label;
      heart.innerHTML='<span class="heart-shape"></span><span class="heart-star">★</span>';
      layer.appendChild(heart);
      continue;
    }

    const badge=document.createElement("div");
    badge.className=`badge ${def.className}`;
    badge.setAttribute("aria-label",def.label);
    badge.title=def.label;

    if(def.icon==="dot"){
      const dot=document.createElement("span");
      dot.className="dot";
      badge.appendChild(dot);
    }else if(def.icon){
      const icon=document.createElement("span");
      icon.className="badge-icon";
      icon.textContent=def.icon;
      badge.appendChild(icon);
    }

    const text=document.createElement("span");
    text.textContent=def.label;
    badge.appendChild(text);
    layer.appendChild(badge);
  }
  return layer;
}

function render(query=""){
  const q=query.trim().toLocaleLowerCase("ru");
  const items=anime.filter(item=>searchableText(item).includes(q));
  catalogEl.innerHTML="";

  if(!items.length){
    catalogEl.innerHTML='<div class="message">Ничего не найдено</div>';
    return;
  }

  for(const item of items){
    const card=document.createElement("div");
    card.className="card";
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    card.setAttribute("aria-label",item.title);

    const img=document.createElement("img");
    img.src=item.image;
    img.alt=item.title;
    img.loading="lazy";
    img.decoding="async";
    card.appendChild(img);

    const badgeLayer=makeBadgeLayer(item);
    if(badgeLayer) card.appendChild(badgeLayer);

    card.addEventListener("click",()=>openAnime(item.url));
    card.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        openAnime(item.url);
      }
    });

    catalogEl.appendChild(card);
  }
}

async function loadCatalog(){
  try{
    const response=await fetch("catalog.json?v=4",{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    anime=await response.json();
    render(search.value);
  }catch(error){
    console.error(error);
    catalogEl.innerHTML='<div class="message">Не удалось загрузить каталог</div>';
  }
}

search.addEventListener("input",e=>render(e.target.value));
loadCatalog();
</script>
</body>
</html>
